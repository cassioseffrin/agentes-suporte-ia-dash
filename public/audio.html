<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voicebox TTS Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-primary);
            font-size: 15px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
        }

        select {
            background-color: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        button {
            flex: 1;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .audio-player-wrapper {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: none;
        }

        audio {
            width: 100%;
            border-radius: 8px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎙️ Voicebox TTS Studio</h1>
        <p class="subtitle">Digite um texto abaixo para sintetizar a voz em tempo real na rede local.</p>

        <div class="form-group">
            <label for="textInput">Texto para Falar</label>
            <textarea id="textInput"
                placeholder="Digite o que deseja que a IA fale...">Olá! Esta é uma demonstração de fala gerada pelo Voicebox na rede local.</textarea>
        </div>

        <div class="controls" style="flex-wrap: wrap;">
            <div style="flex: 1 1 200px;">
                <label for="voiceSelect" style="font-size: 11px; margin-bottom: 4px;">Voz de Notificação</label>
                <select id="voiceSelect" style="width: 100%;">
                    <option value="openai" selected>OpenAI (Default)</option>
                    <option value="dora">Dora (Feminina)</option>
                    <option value="alex">Alex (Masculina)</option>
                    <option value="santa">Santa (Masculina)</option>
                </select>
            </div>

            <div style="flex: 1 1 140px;">
                <label for="speedSelect" style="font-size: 11px; margin-bottom: 4px;">Velocidade</label>
                <select id="speedSelect" style="width: 100%;">
                    <option value="1.0">1.0x (Normal)</option>
                    <option value="1.25" selected>1.25x (Padrão)</option>
                    <option value="1.5">1.5x (Acelerado)</option>
                    <option value="2.0">2.0x (Rápido)</option>
                </select>
            </div>

            <div style="flex: 1 1 100%; margin-top: 8px;">
                <button id="speakBtn" onclick="speakText()">
                    <div class="spinner" id="spinner"></div>
                    <span id="btnText">🔊 Falar Agora</span>
                </button>
            </div>
        </div>

        <div class="audio-player-wrapper" id="playerWrapper">
            <label>Player de Áudio</label>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <script>
        const BACKEND_TTS_URL = "http://localhost:8000/admin/tts";
        const BACKEND_API_KEY = new URLSearchParams(window.location.search).get("token") || "";

        async function speakText() {
            const textInput = document.getElementById("textInput");
            const voiceSelect = document.getElementById("voiceSelect");
            const speedSelect = document.getElementById("speedSelect");
            const speakBtn = document.getElementById("speakBtn");
            const spinner = document.getElementById("spinner");
            const btnText = document.getElementById("btnText");
            const playerWrapper = document.getElementById("playerWrapper");
            const audioPlayer = document.getElementById("audioPlayer");

            const text = textInput.value.trim();
            if (!text) {
                alert("Por favor, digite um texto primeiro!");
                return;
            }

            // Estado de Carregamento
            speakBtn.disabled = true;
            spinner.style.display = "block";
            btnText.innerText = "Gerando áudio...";

            try {
                const response = await fetch(BACKEND_TTS_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${BACKEND_API_KEY}`
                    },
                    body: JSON.stringify({
                        text: text,
                        voice: voiceSelect.value
                    })
                });

                if (!response.ok) {
                    throw new Error(`Erro no servidor: ${response.status}`);
                }

                // Converte a resposta em um Blob e gera a URL de mídia
                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);

                // Configura o player de áudio
                audioPlayer.src = audioUrl;
                audioPlayer.playbackRate = parseFloat(speedSelect.value);
                playerWrapper.style.display = "block";

                // Reproduz o áudio
                await audioPlayer.play();

            } catch (error) {
                console.error("Erro ao gerar fala:", error);
                alert("Falha ao gerar o áudio. Verifique se o backend está rodando em " + BACKEND_TTS_URL);
            } finally {
                // Restaura o botão ao estado normal
                speakBtn.disabled = false;
                spinner.style.display = "none";
                btnText.innerText = "🔊 Falar Agora";
            }
        }
    </script>

</body>

</html>
