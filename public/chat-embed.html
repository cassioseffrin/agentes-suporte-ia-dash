<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat IA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  </style>
</head>
<body>

  <!--
    ╔══════════════════════════════════════════════════════════════════════╗
    ║  CHAT IA - EMBED PAGE (para uso em Delphi WebView, iframe, etc.)  ║
    ║                                                                    ║
    ║  O chat ocupa 100% da viewport, sem FAB flutuante.                ║
    ║  Os parâmetros são passados pela URL query string.                 ║
    ║                                                                    ║
    ║  EXEMPLO DE URL:                                                   ║
    ║  https://dashia.arpasistemas.com.br/chat-embed.html               ║
    ║    ?agent-id=60d615c1-4043-4fb7-936c-be3ac17f6468                 ║
    ║    &agent-name=CONTROL                                             ║
    ║    &agent-title=Sistema CONTROL                                    ║
    ║    &user-email=user@example.com                                    ║
    ║    &user-name=João Silva                                           ║
    ║    &user-cnpj=00000000000000                                       ║
    ║    &api-url=https://assistant.arpasistemas.com.br                  ║
    ║    &api-key=sk-XXX                                                 ║
    ║    &accent-color=rgb(59,141,225)                                   ║
    ║    &bg-color=rgb(255,255,255)                                      ║
    ║    &body-bg-color=rgb(240,244,248)                                 ║
    ║    &text-color=rgb(30,41,59)                                       ║
    ║    &bubble-bot-bg=rgb(255,255,255)                                 ║
    ║    &bubble-bot-color=rgb(30,41,59)                                 ║
    ║    &bubble-user-bg=rgb(59,141,225)                                 ║
    ║    &bubble-user-color=rgb(255,255,255)                             ║
    ║    &allow-minimize-and-close=false                                 ║
    ║                                                                    ║
    ║  VIA DELPHI JAVASCRIPT (após carregamento):                        ║
    ║    var w = document.getElementById('chat-widget');                  ║
    ║    w.setAttribute('user-email', 'novo@email.com');                 ║
    ║    w.setAttribute('user-name', 'Novo Nome');                       ║
    ║    w.setAttribute('user-cnpj', '12345678000100');                  ║
    ║    w.setAttribute('allow-minimize-and-close', 'false');            ║
    ║    w.openChat();   // Abre o chat                                  ║
    ║    w.closeChat();  // Fecha o chat                                 ║
    ║                                                                    ║
    ╚══════════════════════════════════════════════════════════════════════╝
  -->

  <script>
    (function () {
      // 1. Ler parâmetros da URL
      var params = new URLSearchParams(window.location.search);

      // Lista de atributos suportados
      var attrKeys = [
        'agent-id', 'agent-name', 'agent-title',
        'user-email', 'user-name', 'user-cnpj',
        'api-url', 'api-key',
        'accent-color', 'bg-color', 'body-bg-color', 'text-color',
        'bubble-bot-bg', 'bubble-bot-color', 'bubble-user-bg', 'bubble-user-color',
        'allow-minimize-and-close'
      ];

      // 2. Carregar o script do widget (mesmo domínio)
      var script = document.createElement('script');
      script.src = 'chat-ia-widget.js';
      script.onload = function () {

        // 3. Criar o elemento do widget
        var widget = document.createElement('chat-ia-widget');
        widget.id = 'chat-widget';

        // 4. Setar atributos vindos da URL (somente os que foram informados)
        attrKeys.forEach(function (key) {
          var val = params.get(key);
          if (val) widget.setAttribute(key, val);
        });

        // Default api-url caso não informado
        if (!params.get('api-url')) {
          widget.setAttribute('api-url', 'https://assistant.arpasistemas.com.br');
        }

        // 5. Ocultar o FAB (o chat vai ocupar a tela toda)
        widget.setAttribute('hide-fab', '');

        document.body.appendChild(widget);

        // 6. Injetar CSS override no Shadow DOM para forçar fullscreen
        //    O widget usa Shadow DOM, então precisamos injetar o CSS lá dentro
        function injectFullscreenCSS() {
          var shadow = widget.shadowRoot;
          if (!shadow) return false;

          var overrideStyle = document.createElement('style');
          overrideStyle.id = 'embed-fullscreen-override';
          overrideStyle.textContent =
            '.panel.normal, .panel.expanded, .panel.no-fab.bottom-right, .panel.no-fab.bottom-left {' +
            '  position: fixed !important;' +
            '  top: 0 !important;' +
            '  left: 0 !important;' +
            '  right: 0 !important;' +
            '  bottom: 0 !important;' +
            '  width: 100vw !important;' +
            '  height: 100vh !important;' +
            '  border-radius: 0 !important;' +
            '  box-shadow: none !important;' +
            '  animation: none !important;' +
            '}' +
            '.fab { display: none !important; }';
          shadow.appendChild(overrideStyle);
          return true;
        }

        // 7. Abrir o chat automaticamente e aplicar o override
        setTimeout(function () {
          widget.openChat();

          // Tentar injetar o CSS override (pode precisar de um pequeno delay)
          if (!injectFullscreenCSS()) {
            setTimeout(injectFullscreenCSS, 200);
          }

          // Observar mudanças no Shadow DOM para re-aplicar se necessário
          var shadow = widget.shadowRoot;
          if (shadow) {
            var observer = new MutationObserver(function () {
              if (!shadow.querySelector('#embed-fullscreen-override')) {
                injectFullscreenCSS();
              }
            });
            observer.observe(shadow, { childList: true, subtree: true });
          }
        }, 150);
      };
      document.head.appendChild(script);
    })();
  </script>

</body>
</html>
